roles:
  architect:
    name: Architect
    responsibilities:
      - Maintain accepted target Designs, current architecture, and specifications
      - Materialize and revise Design PRs until exact-head human acceptance
      - Decompose accepted Designs into coherent implementation Changes
      - Revalidate and rebind incomplete Changes when an accepted Design revision changes
      - Maintain operator-facing project state when assigned
    capabilities:
      - architecture
      - research
      - documentation
      - design-review
      - project-reporting
    authority:
      implementation: review
      architecture: propose
      specifications: decide

  implementer:
    name: Implementer
    responsibilities:
      - Implement active Changes against their accepted identity and bound Design revision
      - Create and own pull requests for assigned implementation work
      - Respond to actionable review feedback and CI failures
      - Maintain tests and implementation-facing current documentation
      - Update affected Design Realization Maps and traceability index before final review
    capabilities:
      - code-write
      - shell
      - git
      - pull-request
      - review-feedback
      - tests
    authority:
      implementation: decide
      internal-design: decide-and-document-when-durable
      architecture: propose

  reviewer:
    name: Reviewer
    responsibilities:
      - Review final implementation head against the active Change and bound Design revision
      - Leave actionable feedback on pull requests
      - Detect bugs, regressions, contract violations, and stale Design traceability
      - Identify missing or weak tests
      - Own the independent clean-review verdict on the latest head
    capabilities:
      - code-review
      - pull-request-review
      - tests
      - contract-review
    authority:
      implementation: review-only
      architecture: propose

  researcher:
    name: Researcher
    responsibilities:
      - Research technical or product questions
      - Produce evidence and recommendations for Designs or active Changes
      - Record only findings that need to survive the current session
    capabilities:
      - research
      - web-research
      - documentation
    authority:
      implementation: none
      architecture: propose

  generalist:
    name: Generalist
    responsibilities:
      - Research and clarify requirements
      - Materialize/revise Designs and decompose accepted Designs into Changes when assigned
      - Maintain current specs and architecture when assigned
      - Implement active Changes and update affected Design traceability
      - Create and own pull requests when acting as implementer
      - Review and test changes
      - Maintain operator-facing project state when assigned
    capabilities:
      - research
      - architecture
      - documentation
      - code-write
      - code-review
      - pull-request
      - pull-request-review
      - review-feedback
      - tests
      - project-reporting
    authority:
      implementation: decide
      internal-design: decide-and-document-when-durable
      architecture: propose
      specifications: decide
