name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  core-tests:
    name: core-tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install initializer dependencies
        run: python -m pip install --disable-pip-version-check -r init/requirements.txt

      - name: Run initializer tests
        run: python -m unittest discover -s init/tests

      - name: Run check module tests
        run: python -m unittest discover -s check/tests
